<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>PLATFORMX by TRIDENTX · AI-First Telecom Marketplace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E40AF'/%3E%3Cpath d='M16 7v18M10 11a8 8 0 0 1 12 0M7 8a12 12 0 0 1 18 0' stroke='%2306B6D4' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="shell">
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
          <path d="M12 4v16"/><path d="M7.5 8a7 7 0 0 1 9 0"/><path d="M4.5 5a11 11 0 0 1 15 0"/>
        </svg>
      </div>
      <div class="brand-name"><b>PLATFORMX</b><span>by TRIDENTX</span></div>
    </div>
    <div class="topbar-search">
      <svg class="ico icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Ask the Orchestrator Agent across all data…" id="globalSearch" autocomplete="off"/>
    </div>
    <div class="topbar-right">
      <div class="sim-badge"><span class="dot"></span>Simulated Data</div>
      <div class="icon-btn" title="Notifications">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </div>
      <div class="avatar">NL</div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="nav-sect">Marketplace</div>
    <button class="nav-item" data-view="home">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Command Center
    </button>
    <button class="nav-item" data-view="datalayer">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      Data Layer
    </button>
    <button class="nav-item" data-view="dcrrca">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
      Drop Call RCA
    </button>
    <button class="nav-item" data-view="analytics">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Analytics Journey
    </button>
    <button class="nav-item" data-view="agents">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M8 4h8M12 4v4M8 14v1M16 14v1"/></svg>
      Agent Fleet
    </button>

    <div class="nav-sect">Use Cases</div>
    <button class="nav-item" data-view="gallery">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Use-Case Gallery
    </button>
    <button class="nav-item" data-view="bizplan">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Operator Business Plan
      <span class="badge">Flagship</span>
    </button>
    <button class="nav-item" data-view="rfagent">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5.636 5.636A9 9 0 1 0 18 18"/><path d="M12 12v.01"/></svg>
      RF Engineer Agent
    </button>
    <button class="nav-item" data-view="rfchat">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      Chatbot
    </button>
    <button class="nav-item" data-view="mktgagent">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
      Marketing Agent
    </button>
    <button class="nav-item" data-view="builder">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Build a Use-Case
      <span class="badge" style="background:var(--brand);color:#07101F;font-size:9px">NEW</span>
    </button>

    <div class="nav-sect">Admin</div>
    <button class="nav-item" data-view="governance">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Governance &amp; Security
    </button>

    <div class="nav-bottom">
      <div class="build-cta">
        <p>Build your own agentic use-case on top of your data.</p>
        <button onclick="navigate('builder')">Build a Use-Case →</button>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <div class="view-wrap" id="viewWrap"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
